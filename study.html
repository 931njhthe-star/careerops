<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Study Hub | CareerOps</title><style>:root{color-scheme:dark;--bg:#0b1019;--panel:#131d2a;--panel2:#1b2a3b;--line:#304156;--txt:#edf3fa;--muted:#9eafc4;--accent:#76d6af;font:15px/1.55 system-ui,-apple-system,Segoe UI,sans-serif}*{box-sizing:border-box}html{scroll-behavior:auto!important}body{margin:0;background:var(--bg);color:var(--txt)}button,input,textarea,select{font:inherit}a{color:inherit;text-decoration:none}button{cursor:pointer}.container{max-width:1150px;margin:0 auto;padding:30px 24px 100px}.bar{display:flex;align-items:center;gap:15px;justify-content:space-between;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:20px}.brand{font-size:21px;font-weight:800}.brand span{color:var(--accent)}.links{display:flex;flex-wrap:wrap;gap:8px}.btn,.links a{display:inline-flex;padding:9px 14px;border:1px solid #405470;border-radius:9px;background:#1d2b3c;color:#d5e5f3;gap:6px}.btn:hover,.links a:hover{background:#293e54}.links .selected{background:#235a47;border-color:#3b8b6f}.eyebrow{color:var(--accent);font-size:11px;font-weight:800;letter-spacing:1.6px;margin-top:34px}.intro{color:var(--muted);margin-top:4px}h1{font-size:32px;letter-spacing:-.6px;margin:7px 0}h2{font-size:21px;margin:0 0 12px}h3{font-size:16px;margin:0 0 7px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:15px;margin:22px 0}.card,.panel{border:1px solid var(--line);background:var(--panel);border-radius:16px;padding:22px}.card p,.panel p{color:var(--muted);font-size:13px}.card.active{border-color:var(--accent);background:#18312e}.pill{border-radius:100px;border:1px solid #49647b;padding:3px 10px;font-size:11px;display:inline-block;color:#b7cde0}.muted{color:var(--muted)}.small{font-size:12px}.stats{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}.stat{padding:11px 15px;border-radius:10px;background:#1b2a3b;color:var(--muted);font-size:12px}.stat b{font-size:18px;color:#fff}.progress{height:8px;border-radius:12px;background:#304257;overflow:hidden;margin:13px 0}.progress span{display:block;background:linear-gradient(90deg,#51be99,#92e5c5);height:100%}.toolbar{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin:18px 0}.input{border-radius:9px;border:1px solid #41546c;background:#101b2a;color:white;padding:10px 12px;max-width:390px;width:100%}.select{background:#172436;color:#fff;border:1px solid #41546c;border-radius:9px;padding:10px}.topics{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.topic{border:1px solid var(--line);background:#182436;border-radius:11px;padding:16px;text-align:left;color:#fff}.topic:hover,.topic.active{border-color:var(--accent);background:#203a3c}.topic small{display:block;color:#a9b9cc;margin-top:5px}.question{border:1px solid var(--line);background:var(--panel);border-radius:13px;padding:20px;margin:12px 0;scroll-margin-top:20px}.question h3{line-height:1.65;margin:10px 0 13px}.question .head{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:12px;color:#9ddbbf}.answer{background:#112a23;border-left:3px solid #6ad5ad;margin:13px 0;padding:14px 16px;border-radius:8px;line-height:1.8}.answer strong{color:#98eac9}.note{resize:vertical;min-height:65px;width:100%;margin-top:10px}.actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:12px}.actions label{color:var(--muted);font-size:12px}.actions input{accent-color:#5ed9aa}.empty{color:var(--muted);padding:30px;text-align:center}.hidden{display:none!important}.section{margin-top:30px}.toggle{display:inline-flex;align-items:center;gap:7px}.pbtn{font-size:13px;border:1px solid #44627c;color:#e0f6e9;background:#23443b;border-radius:9px;padding:8px 13px}a:focus-visible,button:focus-visible,input:focus-visible{outline:2px solid #74e3b5;outline-offset:2px}@media(max-width:850px){.grid{grid-template-columns:1fr}.topics{grid-template-columns:1fr}.container{padding:17px 15px 80px}h1{font-size:26px}.links{gap:4px}.links a{font-size:12px;padding:8px}}</style><script src="questions-data.js"></script></head><body><div class="container"><header class="bar"><a href="index.html" class="brand">Career<span>Ops</span></a><nav class="links"><a href="index.html">홈</a><a href="study.html" class="selected">Study Hub</a><a href="interview.html">Interview Practice</a><a href="math.html">Vision Math</a><a href="review.html" class="">Review Notes</a></nav></header><div class="eyebrow">TECHNICAL STUDY HUB</div><h1>분야별 기술 학습</h1><p class="intro">Machine Vision & GPU · AI Orchestration · Common Engineering — 하나의 문제를 분야·태그·산업별로 찾아 공부하세요.</p><div class="stats" id="stats"></div><div class="grid" id="domains"></div><section class="panel"><h2 id="domainTitle">학습 주제</h2><p id="domainInfo"></p><div id="topics" class="topics"></div></section><div class="section"><h2>학습 문제 <span class="pill" id="count">0</span></h2><div class="toolbar"><input class="input" id="search" placeholder="문제 번호, 모델, 설명 검색"><select class="select" id="industry"><option value="">모든 산업</option><option value="automotive">자동차</option><option value="robotics">로봇</option><option value="manufacturing">공장·제조</option></select><select class="select" id="status"><option value="all">전체 문제</option><option value="todo">미완료</option><option value="weak">취약 (0~4점)</option><option value="done">완료</option></select><button class="btn" id="reset">필터 초기화</button></div><div id="questions"></div></div></div><script>
const KEY=STUDY_STORAGE_KEY;let records={};try{records=JSON.parse(localStorage.getItem(KEY)||'{}')||{}}catch(e){};let domain="vision",topic="",industry="",status="all",search="";
const $=id=>document.getElementById(id);const safe=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const rec=id=>records[id]||{};function save(id,key,value){records[id]??={};records[id][key]=value;localStorage.setItem(KEY,JSON.stringify(records));renderStats()}
function renderStats(){let done=QUESTIONS.filter(q=>rec(q.id).done).length,weak=QUESTIONS.filter(q=>rec(q.id).score!==undefined&&Number(rec(q.id).score)<=4).length;$("stats").innerHTML='<div class="stat"><b>'+QUESTIONS.length+'</b> 전체 문제</div><div class="stat"><b>'+done+'</b> 학습 완료</div><div class="stat"><b>'+weak+'</b> 취약 문제</div><div class="stat"><b>'+STUDY_DOMAINS.length+'</b> 학습 영역</div>'}
function cards(){const selected=STUDY_DOMAINS.find(d=>d.id===domain);$("domains").innerHTML=STUDY_DOMAINS.map(d=>{let list=QUESTIONS.filter(q=>d.sections.includes(q.section)),done=list.filter(q=>rec(q.id).done).length;return '<button class="card '+(d.id===domain?'active':'')+'" data-domain="'+d.id+'" style="text-align:left;color:inherit"><h2>'+safe(d.name)+'</h2><p>'+safe(d.description)+'</p><div class="pill">'+list.length+'개 문제</div><div class="progress"><span style="width:'+(list.length?100*done/list.length:0)+'%"></span></div><small class="muted">'+done+' / '+list.length+' 완료</small></button>'}).join('');$("domainTitle").textContent=selected.name+" · 세부 주제";$("domainInfo").textContent="각 주제를 누르면 해당 문제만 필터링됩니다. '전체 주제'로 돌아갈 수 있습니다.";$("topics").innerHTML='<button class="topic '+(!topic?'active':'')+'" data-topic="">전체 주제<small>'+QUESTIONS.filter(q=>selected.sections.includes(q.section)).length+'문제</small></button>'+selected.topics.map((t,i)=>'<button class="topic '+(topic===String(i)?'active':'')+'" data-topic="'+i+'">'+safe(t[0])+'<small>'+QUESTIONS.filter(q=>t[1].includes(q.section)).length+'문제</small></button>').join('')}
function list(){const sel=STUDY_DOMAINS.find(d=>d.id===domain);const sections=topic===""?sel.sections:sel.topics[Number(topic)][1];return QUESTIONS.filter(q=>sections.includes(q.section)).filter(q=>!industry||(INDUSTRY_SECTIONS[industry]||[]).includes(q.section)).filter(q=>status==="all"||(status==="done"&&rec(q.id).done)||(status==="todo"&&!rec(q.id).done)||(status==="weak"&&rec(q.id).score!==undefined&&Number(rec(q.id).score)<=4)).filter(q=>!search||[q.id,q.title,q.answer,q.follow].some(v=>v.toLowerCase().includes(search)))}
function qHtml(q){const r=rec(q.id),sec=SECTIONS.find(s=>s.id===q.section);return '<article class="question" id="'+q.id.toLowerCase()+'"><div class="head"><b>'+q.id+'</b><span class="pill">'+safe(sec?.name)+'</span></div><h3>'+safe(q.title)+'</h3><button class="pbtn" data-action="answer" data-id="'+q.id+'">정답·설명 펼치기</button><div class="answer hidden" id="ans-'+q.id+'"><strong>핵심 설명</strong><div>'+safe(q.answer)+'</div><hr style="border:0;border-top:1px solid #345547"><strong>실무 꼬리질문</strong><div>'+safe(q.follow)+'</div><div style="margin-top:14px;padding:12px;background:#193830;border-radius:9px"><strong>실무 답변 예시</strong><div>'+safe(q.followAnswer||'답변 준비 중')+'</div></div></div><div class="actions"><label class="toggle"><input type="checkbox" data-action="done" data-id="'+q.id+'" '+(r.done?'checked':'')+'> 완료</label><label>자기평가 <select class="select" data-action="score" data-id="'+q.id+'"><option value="">미평가</option>'+Array.from({length:11},(_,i)=>'<option value="'+i+'" '+(r.score===i?'selected':'')+'>'+i+'/10</option>').join('')+'</select></label><a class="btn" href="interview.html#'+q.id.toLowerCase()+'">면접 모드 ↗</a></div><textarea class="input note" data-action="note" data-id="'+q.id+'" placeholder="복습 메모">'+safe(r.note||'')+'</textarea></article>'}
function show(){const ls=list();$("count").textContent=ls.length+"문제";$("questions").innerHTML=ls.length?ls.map(qHtml).join(''):'<div class="empty">해당 조건의 문제가 없습니다.</div>'}
function render(){cards();show();renderStats()}$("domains").onclick=e=>{const x=e.target.closest("[data-domain]");if(x){domain=x.dataset.domain;topic="";industry="";$("industry").value="";render()}};$("topics").onclick=e=>{const x=e.target.closest("[data-topic]");if(x){topic=x.dataset.topic;render()}};$("search").oninput=e=>{search=e.target.value.toLowerCase().trim();show()};$("industry").onchange=e=>{industry=e.target.value;show()};$("status").onchange=e=>{status=e.target.value;show()};$("reset").onclick=()=>{topic="";industry="";status="all";search="";$("search").value="";$("industry").value="";$("status").value="all";render()};$("questions").onclick=e=>{const b=e.target.closest('button[data-action="answer"]');if(!b)return;const el=$("ans-"+b.dataset.id);el.classList.toggle("hidden");b.textContent=el.classList.contains("hidden")?"정답·설명 펼치기":"정답·설명 닫기"};$("questions").onchange=e=>{let el=e.target,id=el.dataset.id;if(!id)return;if(el.dataset.action==="done")save(id,"done",el.checked);if(el.dataset.action==="score"){records[id]??={};if(el.value==="")delete records[id].score;else records[id].score=Number(el.value);localStorage.setItem(KEY,JSON.stringify(records));renderStats()}cards()};$("questions").oninput=e=>{let el=e.target;if(el.dataset.action==="note"){save(el.dataset.id,"note",el.value)}};let hash=new URLSearchParams(location.search);if(["vision","orchestration","common"].includes(hash.get("domain")))domain=hash.get("domain");if(hash.get("industry")&&INDUSTRY_SECTIONS[hash.get("industry")])industry=hash.get("industry");$("industry").value=industry;render();</script></body></html>
