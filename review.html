<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Review Notes | CareerOps</title><style>:root{color-scheme:dark;--bg:#0b1019;--panel:#131d2a;--panel2:#1b2a3b;--line:#304156;--txt:#edf3fa;--muted:#9eafc4;--accent:#76d6af;font:15px/1.55 system-ui,-apple-system,Segoe UI,sans-serif}*{box-sizing:border-box}html{scroll-behavior:auto!important}body{margin:0;background:var(--bg);color:var(--txt)}button,input,textarea,select{font:inherit}a{color:inherit;text-decoration:none}button{cursor:pointer}.container{max-width:1150px;margin:0 auto;padding:30px 24px 100px}.bar{display:flex;align-items:center;gap:15px;justify-content:space-between;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:20px}.brand{font-size:21px;font-weight:800}.brand span{color:var(--accent)}.links{display:flex;flex-wrap:wrap;gap:8px}.btn,.links a{display:inline-flex;padding:9px 14px;border:1px solid #405470;border-radius:9px;background:#1d2b3c;color:#d5e5f3;gap:6px}.btn:hover,.links a:hover{background:#293e54}.links .selected{background:#235a47;border-color:#3b8b6f}.eyebrow{color:var(--accent);font-size:11px;font-weight:800;letter-spacing:1.6px;margin-top:34px}.intro{color:var(--muted);margin-top:4px}h1{font-size:32px;letter-spacing:-.6px;margin:7px 0}h2{font-size:21px;margin:0 0 12px}h3{font-size:16px;margin:0 0 7px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:15px;margin:22px 0}.card,.panel{border:1px solid var(--line);background:var(--panel);border-radius:16px;padding:22px}.card p,.panel p{color:var(--muted);font-size:13px}.card.active{border-color:var(--accent);background:#18312e}.pill{border-radius:100px;border:1px solid #49647b;padding:3px 10px;font-size:11px;display:inline-block;color:#b7cde0}.muted{color:var(--muted)}.small{font-size:12px}.stats{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}.stat{padding:11px 15px;border-radius:10px;background:#1b2a3b;color:var(--muted);font-size:12px}.stat b{font-size:18px;color:#fff}.progress{height:8px;border-radius:12px;background:#304257;overflow:hidden;margin:13px 0}.progress span{display:block;background:linear-gradient(90deg,#51be99,#92e5c5);height:100%}.toolbar{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin:18px 0}.input{border-radius:9px;border:1px solid #41546c;background:#101b2a;color:white;padding:10px 12px;max-width:390px;width:100%}.select{background:#172436;color:#fff;border:1px solid #41546c;border-radius:9px;padding:10px}.topics{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.topic{border:1px solid var(--line);background:#182436;border-radius:11px;padding:16px;text-align:left;color:#fff}.topic:hover,.topic.active{border-color:var(--accent);background:#203a3c}.topic small{display:block;color:#a9b9cc;margin-top:5px}.question{border:1px solid var(--line);background:var(--panel);border-radius:13px;padding:20px;margin:12px 0;scroll-margin-top:20px}.question h3{line-height:1.65;margin:10px 0 13px}.question .head{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:12px;color:#9ddbbf}.answer{background:#112a23;border-left:3px solid #6ad5ad;margin:13px 0;padding:14px 16px;border-radius:8px;line-height:1.8}.answer strong{color:#98eac9}.note{resize:vertical;min-height:65px;width:100%;margin-top:10px}.actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:12px}.actions label{color:var(--muted);font-size:12px}.actions input{accent-color:#5ed9aa}.empty{color:var(--muted);padding:30px;text-align:center}.hidden{display:none!important}.section{margin-top:30px}.toggle{display:inline-flex;align-items:center;gap:7px}.pbtn{font-size:13px;border:1px solid #44627c;color:#e0f6e9;background:#23443b;border-radius:9px;padding:8px 13px}a:focus-visible,button:focus-visible,input:focus-visible{outline:2px solid #74e3b5;outline-offset:2px}@media(max-width:850px){.grid{grid-template-columns:1fr}.topics{grid-template-columns:1fr}.container{padding:17px 15px 80px}h1{font-size:26px}.links{gap:4px}.links a{font-size:12px;padding:8px}}</style><script src="questions-data.js"></script></head><body><div class="container"><header class="bar"><a href="index.html" class="brand">Career<span>Ops</span></a><nav class="links"><a href="index.html">홈</a><a href="study.html" class="">Study Hub</a><a href="interview.html">Interview Practice</a><a href="review.html" class="selected">Review Notes</a></nav></header><div class="eyebrow">REVIEW NOTES</div><h1>오답·복습 노트</h1><p class="intro">Study Hub와 면접 연습에서 기록한 점수·메모·완료 상태를 함께 확인하세요.</p><div id="stats" class="stats"></div><div class="toolbar"><select id="filter" class="select"><option value="weak">취약 문제 (0~4점)</option><option value="medium">복습 필요 (5~7점)</option><option value="notes">메모한 문제</option><option value="todo">미완료 문제</option><option value="all">전체 문제</option></select><select id="domain" class="select"><option value="">모든 분야</option><option value="vision">Machine Vision & GPU</option><option value="orchestration">AI Orchestration</option><option value="common">Common Engineering</option></select><input id="search" class="input" placeholder="검색어 · Q번호"></div><div id="list"></div></div><script>
const KEY=STUDY_STORAGE_KEY;let records={};try{records=JSON.parse(localStorage.getItem(KEY)||'{}')||{}}catch(e){};const $=id=>document.getElementById(id);const safe=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));const rec=id=>records[id]||{};function persist(){localStorage.setItem(KEY,JSON.stringify(records));render()}function render(){const done=QUESTIONS.filter(q=>rec(q.id).done).length,weak=QUESTIONS.filter(q=>rec(q.id).score!==undefined&&Number(rec(q.id).score)<=4).length,notes=QUESTIONS.filter(q=>rec(q.id).note?.trim()).length;$("stats").innerHTML='<div class="stat"><b>'+QUESTIONS.length+'</b> 전체 문제</div><div class="stat"><b>'+done+'</b> 완료</div><div class="stat"><b>'+weak+'</b> 취약</div><div class="stat"><b>'+notes+'</b> 메모 작성</div>';const f=$("filter").value,d=$("domain").value,term=$("search").value.toLowerCase().trim();const dom=STUDY_DOMAINS.find(x=>x.id===d);const ls=QUESTIONS.filter(q=>!dom||dom.sections.includes(q.section)).filter(q=>f==="all"||(f==="weak"&&rec(q.id).score!==undefined&&Number(rec(q.id).score)<=4)||(f==="medium"&&rec(q.id).score>=5&&rec(q.id).score<=7)||(f==="notes"&&rec(q.id).note?.trim())||(f==="todo"&&!rec(q.id).done)).filter(q=>(q.id+" "+q.title+" "+q.answer+" "+(rec(q.id).note||"")).toLowerCase().includes(term));$("list").innerHTML=ls.length?ls.map(q=>{const r=rec(q.id),sec=SECTIONS.find(s=>s.id===q.section);return '<article class="question"><div class="head"><b>'+q.id+'</b><span class="pill">'+safe(sec?.name)+'</span><span class="pill">점수 '+(r.score===undefined?'미평가':r.score+'/10')+'</span></div><h3>'+safe(q.title)+'</h3><p>'+safe(q.answer)+'</p>'+(r.note?'<div class="answer"><strong>내 메모</strong><div>'+safe(r.note)+'</div></div>':'')+'<div class="actions"><label class="toggle"><input data-id="'+q.id+'" type="checkbox" '+(r.done?'checked':'')+'> 학습 완료</label><a class="btn" href="interview.html#'+q.id.toLowerCase()+'">문제 다시 풀기 →</a></div></article>'}).join(''):'<div class="panel empty">해당 조건에 맞는 문제가 없습니다. 면접 족보에서 점수나 메모를 기록해 보세요.</div>'}["filter","domain","search"].forEach(x=>$(x).addEventListener(x==="search"?"input":"change",render));$("list").addEventListener("change",e=>{const el=e.target;if(el.dataset.id){records[el.dataset.id]??={};records[el.dataset.id].done=el.checked;persist()}});render();</script></body></html>
