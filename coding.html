<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Coding Problems | CareerOps</title><meta name="description" content="C++17 코딩테스트와 머신비전·CUDA 구현 문제, 힌트, 정답 코드, 해설"><style>:root{color-scheme:dark;--bg:#0b111b;--panel:#141e2b;--panel2:#1c2c3c;--line:#32465b;--fg:#e9f2fb;--muted:#a3b4c9;--green:#75d7b2;font:15px/1.65 system-ui,-apple-system,"Segoe UI",sans-serif}*{box-sizing:border-box}html{scroll-behavior:auto!important}body{margin:0;background:var(--bg);color:var(--fg)}button,input,select,textarea{font:inherit}button{cursor:pointer}a{color:inherit;text-decoration:none}.container{max-width:1200px;padding:25px 20px 80px;margin:auto}.header{display:flex;justify-content:space-between;align-items:center;gap:15px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:18px}.brand{font-size:22px;font-weight:800}.brand b{color:var(--green)}nav{display:flex;gap:8px;flex-wrap:wrap}nav a,.btn{border:1px solid #405771;background:#203044;border-radius:9px;padding:9px 13px;color:#e0eaf5;display:inline-flex;gap:7px;align-items:center;font-size:13px}nav a:hover,.btn:hover{background:#29435b}.eyebrow{color:var(--green);font-size:11px;font-weight:800;letter-spacing:1.6px;margin-top:32px}h1{font-size:32px;margin:8px 0}h2{font-size:20px;margin:0 0 12px}h3{font-size:16px;margin:0 0 8px}.muted{color:var(--muted)}.small{font-size:12px}.stats{display:flex;gap:10px;flex-wrap:wrap;margin:19px 0}.stat{border:1px solid var(--line);background:var(--panel);padding:13px 16px;border-radius:12px;color:var(--muted);font-size:12px}.stat b{color:#fff;font-size:20px}.layout{display:grid;grid-template-columns:310px minmax(0,1fr);gap:17px}.panel{border:1px solid var(--line);background:var(--panel);padding:21px;border-radius:14px}.side{position:sticky;top:16px;align-self:start;max-height:calc(100vh - 30px);overflow:auto}.filters{display:grid;gap:9px;margin-bottom:15px}input,select,textarea{background:#0e1a28;border:1px solid #42566f;color:var(--fg);border-radius:9px;padding:10px 12px}input,select{width:100%}.problem-link{border:1px solid transparent;color:#d5e4f4;background:transparent;padding:12px;text-align:left;border-radius:10px;width:100%;margin:3px 0}.problem-link.active,.problem-link:hover{background:#214238;border-color:#4a9475}.problem-link small{display:block;color:#a3bbcd;margin-top:3px}.badge{border:1px solid #496379;border-radius:100px;color:#b6cadc;padding:3px 9px;font-size:11px;display:inline-block}.data{padding:14px 16px;margin:10px 0;border:1px solid #344e66;border-radius:10px;background:#0e1e2c;white-space:pre-wrap;overflow-wrap:anywhere}.data strong{color:#9be9c5;display:block;margin-bottom:6px}.code{background:#081522;border:1px solid #2f4c62;border-radius:11px;padding:17px;font:12px/1.65 ui-monospace,SFMono-Regular,Consolas,monospace;overflow:auto;white-space:pre}.editor{font:13px/1.7 ui-monospace,SFMono-Regular,Consolas,monospace;width:100%;min-height:340px;resize:vertical;tab-size:4}.mutednote{font-size:12px;color:var(--muted);margin-top:6px}.toolbar{display:flex;gap:9px;flex-wrap:wrap;align-items:center;margin:12px 0}.answer{border-left:3px solid #5cca9d;background:#103026;border-radius:0 10px 10px 0;padding:15px;margin:12px 0;line-height:1.75}.hidden{display:none!important}.progress{height:8px;border-radius:9px;background:#2a3a4b;overflow:hidden;margin:10px 0}.progress span{display:block;background:#65c99f;height:100%}.bottom{border-top:1px solid var(--line);padding-top:15px;margin-top:22px}.grow{flex:1}.switch{display:inline-flex;gap:8px;align-items:center}.switch input{width:auto;accent-color:#78d8b3}.subtitle{color:var(--muted);font-size:13px;margin:4px 0 20px}.warning{background:#2c2818;border:1px solid #6e5a2e;border-radius:10px;padding:10px 12px;color:#e7cc91;font-size:13px;margin:12px 0}@media(max-width:850px){.container{padding:17px 14px 70px}.layout{display:block}.side{position:static;max-height:none;margin-bottom:17px}h1{font-size:26px}.panel{padding:16px}.editor{min-height:280px}}</style><script src="coding-data.js"></script></head><body><main class="container"><header class="header"><a class="brand" href="index.html">Career<b>Ops</b></a><nav><a href="index.html">홈</a><a href="algorithms.html">Theory</a><a href="coding.html" style="background:#23553e">Coding Problems</a><a href="study.html">Study Hub</a><a href="interview.html">면접 연습</a></nav></header><div class="eyebrow">ALGORITHM INTERVIEW LAB / CODING</div><h1>코딩 문제 풀기</h1><p class="subtitle">코드를 직접 작성하고 저장한 다음, 단계별 힌트와 C++17 모범 코드·해설을 확인하세요. 코드 실행·자동 채점 기능은 없습니다.</p><div class="stats"><div class="stat"><b id="total">0</b> 전체 문제</div><div class="stat"><b id="complete">0</b> 풀이 완료</div><div class="stat"><b id="review">0</b> 복습 표시</div><div class="stat"><b id="saved">0</b> 작성한 코드</div></div><div class="layout"><aside class="panel side"><h3>문제 목록</h3><div class="filters"><select id="track"><option value="">전체 트랙</option><option value="Algorithm Coding Test">Algorithm Coding Test</option><option value="C++ / Performance">C++ / Performance</option><option value="Computer Vision / CUDA">Computer Vision / CUDA</option></select><select id="level"><option value="">전체 난이도</option><option value="Basic">Basic</option><option value="Intermediate">Intermediate</option><option value="Advanced">Advanced</option></select><select id="status"><option value="">전체 상태</option><option value="todo">미완료</option><option value="done">완료</option><option value="review">복습 필요</option></select><input type="search" id="search" placeholder="제목·키워드 검색"></div><div class="progress"><span id="bar"></span></div><p class="muted small" id="count"></p><div id="problemList"></div></aside><div><article id="problem" class="panel"><h2>왼쪽에서 문제를 선택하세요.</h2></article></div></div></main><script>
const D=CODING_PROBLEMS,KEY="careerops-coding-v1";let state={};try{state=JSON.parse(localStorage.getItem(KEY)||"{}")||{}}catch(e){};let current=D[0]?.id||"",filterTrack="",filterLevel="",filterStatus="",search="",hint=0,showSolution=false;
const $=id=>document.getElementById(id),esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])),get=id=>state[id]||{};
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(state));$("saveStatus").textContent="이 브라우저에 저장됨"}catch(e){$("saveStatus").textContent="저장 실패: 브라우저 저장 용량을 확인하세요"}};
function counts(){const done=D.filter(x=>get(x.id).done).length;$("total").textContent=D.length;$("complete").textContent=done;$("review").textContent=D.filter(x=>get(x.id).review).length;$("saved").textContent=D.filter(x=>get(x.id).code?.trim()).length;$("bar").style.width=(done/D.length*100)+"%"}
function filtered(){return D.filter(p=>!filterTrack||p.track===filterTrack).filter(p=>!filterLevel||p.level===filterLevel).filter(p=>!filterStatus||(filterStatus==="done"&&get(p.id).done)||(filterStatus==="todo"&&!get(p.id).done)||(filterStatus==="review"&&get(p.id).review)).filter(p=>!search||(p.title+" "+p.statement+" "+p.track).toLowerCase().includes(search))}
function list(){const a=filtered();$("count").textContent=a.length+"개 문제 표시";$("problemList").innerHTML=a.length?a.map(p=>'<button class="problem-link '+(p.id===current?'active':'')+'" data-id="'+p.id+'"><span class="badge">'+p.id+'</span> <span class="badge">'+p.level+'</span><b style="display:block;margin-top:6px">'+esc(p.title)+'</b><small>'+esc(p.track)+'</small>'+(get(p.id).done?'<small style="color:#7ee4b7">✓ 풀이 완료</small>':'')+'</button>').join(""):'<p class="muted small">조건에 맞는 문제가 없습니다.</p>'}
function openProblem(){const p=D.find(x=>x.id===current);if(!p){$("problem").innerHTML="<h2>문제를 선택하세요.</h2>";return}const r=get(p.id);$("problem").innerHTML='<div class="eyebrow" style="margin:0">'+p.id+' / '+esc(p.track)+'</div><h2 style="font-size:26px;margin:12px 0">'+esc(p.title)+'</h2><span class="badge">'+p.level+'</span><h3 style="margin-top:23px">문제</h3><p>'+esc(p.statement)+'</p><div class="data"><strong>입력 예시</strong>'+esc(p.input)+'</div><div class="data"><strong>출력 예시</strong>'+esc(p.output)+'</div><div class="data"><strong>제약 조건</strong>'+esc(p.constraints)+'</div><div class="warning">해답 실행·자동 채점 없이 직접 풀이와 정답 코드를 비교하는 학습 페이지입니다.</div><h3 style="margin-top:25px">내 풀이</h3><textarea class="editor" id="editor" spellcheck="false" placeholder="C++17 코드를 이곳에 작성하세요. 작성 중 자동으로 저장됩니다.">'+esc(r.code||"")+'</textarea><div class="toolbar"><span class="muted small grow" id="saveStatus">입력하면 이 브라우저에 자동 저장됩니다.</span><button class="btn" id="copy">내 코드 복사</button><button class="btn" id="resetCode">내 코드 초기화</button></div><div class="bottom"><h3>단계별 힌트</h3><button class="btn" id="hintButton"></button><div id="hints"></div><h3 style="margin-top:25px">모범 코드와 해설</h3><button class="btn" id="solutionButton"></button><div id="solutionContainer" class="hidden"><h3 style="margin-top:16px">정답 코드</h3><pre class="code" id="answerCode"><code>'+esc(p.solution)+'</code></pre><button class="btn" id="copySolution">정답 코드 복사</button><div class="answer"><strong>풀이 해설</strong><p>'+esc(p.explanation)+'</p><strong>시간 복잡도</strong><div>'+esc(p.time)+'</div><strong>공간 복잡도</strong><div>'+esc(p.space)+'</div></div></div><div class="toolbar bottom"><label class="switch"><input type="checkbox" id="done" '+(r.done?'checked':'')+'> 풀이 완료</label><label class="switch"><input type="checkbox" id="reviewCheck" '+(r.review?'checked':'')+'> 복습 필요</label></div><div class="toolbar"><button class="btn" id="prev">← 이전 문제</button><button class="btn" id="next">다음 문제 →</button><a class="btn" href="algorithms.html">개념 학습 페이지 →</a></div></div>';
$("editor").addEventListener("input",e=>{state[p.id]??={};state[p.id].code=e.target.value;save();counts()});
$("copy").onclick=()=>navigator.clipboard.writeText($("editor").value).catch(()=>alert("복사에 실패했습니다"));
$("resetCode").onclick=()=>{if(!confirm("이 문제에 작성한 코드를 지울까요?"))return;$("editor").value="";state[p.id]??={};state[p.id].code="";save();counts()};
$("done").onchange=e=>{state[p.id]??={};state[p.id].done=e.target.checked;save();counts();list()};
$("reviewCheck").onchange=e=>{state[p.id]??={};state[p.id].review=e.target.checked;save();counts();list()};
function drawHints(){$("hintButton").textContent=hint<2?"힌트 "+(hint+1)+" 보기":"힌트 초기화";$("hints").innerHTML=p.hints.slice(0,hint).map((x,i)=>'<div class="data"><strong>힌트 '+(i+1)+'</strong>'+esc(x)+'</div>').join("")}
$("hintButton").onclick=()=>{hint=hint<2?hint+1:0;drawHints()};drawHints();
function drawSolution(){$("solutionButton").textContent=showSolution?"모범 코드·해설 숨기기":"모범 코드·해설 보기";$("solutionContainer").classList.toggle("hidden",!showSolution);if(showSolution)$("copySolution").onclick=()=>navigator.clipboard.writeText(p.solution).catch(()=>alert("복사에 실패했습니다"))}
$("solutionButton").onclick=()=>{showSolution=!showSolution;drawSolution()};drawSolution();
const idx=D.findIndex(x=>x.id===current);$("prev").disabled=idx<=0;$("next").disabled=idx>=D.length-1;$("prev").onclick=()=>select(D[idx-1].id);$("next").onclick=()=>select(D[idx+1].id);
}
function select(id){if(!id||!D.some(x=>x.id===id))return;current=id;hint=0;showSolution=false;list();openProblem();history.replaceState(null,"","#"+id.toLowerCase());$("problem").scrollIntoView({behavior:"instant",block:"start"})}
$("problemList").onclick=e=>{const b=e.target.closest("[data-id]");if(b)select(b.dataset.id)};
$("track").onchange=e=>{filterTrack=e.target.value;list()};$("level").onchange=e=>{filterLevel=e.target.value;list()};$("status").onchange=e=>{filterStatus=e.target.value;list()};$("search").oninput=e=>{search=e.target.value.toLowerCase().trim();list()};
const fromHash=location.hash.slice(1).toUpperCase();if(D.some(p=>p.id===fromHash))current=fromHash;counts();list();openProblem();
</script></body></html>
